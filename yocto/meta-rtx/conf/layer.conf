# Register RTX recipes and runtime-test paths with OpenEmbedded layer discovery.
# Listed release series are compatibility intentions; recorded validation identifies tested revisions.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"
BBFILE_COLLECTIONS += "rtx"
BBFILE_PATTERN_rtx = "^${LAYERDIR}/"
BBFILE_PRIORITY_rtx = "6"
LAYERSERIES_COMPAT_rtx = "scarthgap styhead walnascar"
LAYERDEPENDS_rtx = "core"
